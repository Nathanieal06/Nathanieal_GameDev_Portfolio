  <style>
    /* Specific styles for Resume page to match the screenshot */
    .resume-container {
      max-width: 1000px;
      margin: 8rem auto 3rem;
      padding: 0 2rem;
      text-align: center;
    }
    .resume-header {
      margin-bottom: 2rem;
    }
    .resume-title {
      font-family: var(--font-sans);
      font-size: 2.5rem;
      font-weight: 800;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 1rem;
    }
    .resume-divider {
      width: 100%;
      height: 1px;
      background-color: #333;
      margin: 1.5rem 0 2rem;
    }
    .resume-btn {
      display: inline-block;
      background-color: #3b82f6;
      color: #fff;
      padding: 0.8rem 2rem;
      border-radius: 4px;
      font-weight: 600;
      text-decoration: none;
      font-size: 1rem;
      transition: background-color 0.3s;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .resume-btn:hover {
      background-color: #2563eb;
    }
    .resume-btn i {
      margin-right: 0.5rem;
    }
    .resume-updated {
      font-family: monospace;
      color: #888;
      font-size: 0.85rem;
      margin-bottom: 2.5rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .pdf-viewer-container {
      width: 100%;
      height: 1100px;
      border: 1px solid #333;
      border-radius: 8px;
      overflow: hidden;
      background-color: #1a1a1a;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .pdf-viewer-container object {
      width: 100%;
      height: 100%;
      display: block;
    }
    .back-to-top {
      display: inline-block;
      background-color: #222;
      color: #fff;
      padding: 0.8rem 2rem;
      border-radius: 4px;
      font-weight: 500;
      text-decoration: none;
      margin-top: 4rem;
      transition: background-color 0.3s;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 0.9rem;
      border: 1px solid #333;
    }
    .back-to-top:hover {
      background-color: #333;
      border-color: #444;
    }
  </style>
  <link rel="stylesheet" href="../assets/css/chatbot.css">
